<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escoge tu menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EBE3; --paper:#FFFBF6; --ink:#2A1A17; --muted:#6E5A55;
  --wine:#6E1F1B; --wine-soft:#F1DCD6; --line:#E2D2C6; --band:#6E1F1B; --band2:#8C2E26;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1514; --paper:#2A1F1D; --ink:#F4EAE4; --muted:#BFA9A2;
    --wine:#E2847A; --wine-soft:#46282A; --line:#463532; --band:#5A1A17; --band2:#73241F;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1514; --paper:#2A1F1D; --ink:#F4EAE4; --muted:#BFA9A2;
  --wine:#E2847A; --wine-soft:#46282A; --line:#463532; --band:#5A1A17; --band2:#73241F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
.band{height:14px;background:repeating-linear-gradient(135deg,var(--band) 0 10px,var(--band2) 10px 20px)}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
.evento{color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;margin:0}
h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:2.3rem;line-height:1.05;margin:4px 0 10px;color:var(--wine)}
.intro{color:var(--muted);margin:0 0 24px}
label.name{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--wine-soft);border-color:var(--wine)}
fieldset{border:0;padding:0;margin:30px 0 0;min-width:0}
legend{font-family:"DM Serif Display",Georgia,serif;font-size:1.45rem;padding:0;margin-bottom:10px}
.grupo{font-weight:700;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.dot{flex:none;width:20px;height:20px;border-radius:50%;margin-top:2px;border:2px solid var(--muted);display:grid;place-items:center}
.opt:has(input:checked){border-color:var(--wine);background:var(--wine-soft)}
.opt:has(input:checked) .dot{border-color:var(--wine)}
.opt:has(input:checked) .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--wine)}
.opt:has(input:focus-visible){outline:3px solid var(--wine);outline-offset:2px}
.opt b{display:block}
.opt small{color:var(--muted);display:block;font-size:.88rem}
.sub{margin:4px 0 12px 32px;display:none}
.sub.show{display:block}
.sub p{margin:0 0 6px;font-weight:700;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span{display:inline-block;padding:7px 14px;border-radius:999px;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);font-size:.92rem}
.chip input:checked+span{background:var(--wine);border-color:var(--wine);color:var(--paper)}
.chip input:focus-visible+span{outline:3px solid var(--wine);outline-offset:2px}
.incluye{margin-top:30px;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:.95rem}
.incluye strong{color:var(--ink)}
.error{color:var(--wine);font-weight:700;min-height:1.4em;margin:22px 0 8px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;cursor:pointer;padding:15px 18px;width:100%}
.primary{background:var(--wine);color:var(--paper);font-size:1.05rem}
.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--wine);margin-top:12px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#resumen{display:none}
#resumen.show{display:block}
.ticket{background:var(--paper);border-radius:14px;overflow:hidden;border:1.5px solid var(--line)}
.ticket .inner{padding:22px 20px 18px}
.ticket h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:1.9rem;margin:0 0 2px;color:var(--wine);line-height:1.1}
.ticket .sub2{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.row span{color:var(--muted);font-size:.9rem;flex:none}
.row strong{text-align:right}
.codes{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--wine-soft);text-align:center;font-weight:700;letter-spacing:.04em}
.hint{text-align:center;color:var(--muted);margin:18px 0 0;font-size:.95rem}
@media (prefers-reduced-motion:no-preference){
  #resumen.show .ticket{animation:pop .35s ease-out}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<main>
  <section id="formulario">
    <p class="evento" id="evento"></p>
    <h1>Escoge tu menú</h1>
    <p class="intro">Marca una opción en cada parte. Al final te sale un resumen: tómale captura y mándala por WhatsApp.</p>

    <label class="name" for="nombre">Tu nombre</label>
    <input type="text" id="nombre" autocomplete="name" placeholder="Ej: Ana Gómez">

    <div id="secciones"></div>

    <div class="incluye"><strong>Incluido para todos:</strong> brochetas de pan francés de entrada y un vaso de gaseosa.</div>

    <p class="error" id="error" role="alert"></p>
    <button class="primary" id="ver">Ver mi pedido</button>
  </section>

  <section id="resumen" aria-live="polite">
    <div class="ticket">
      <div class="band" aria-hidden="true"></div>
      <div class="inner">
        <h2 id="r-nombre"></h2>
        <p class="sub2" id="r-evento">Mi menú escogido</p>
        <div id="r-filas"></div>
        <div class="codes" id="r-codigos"></div>
      </div>
    </div>
    <p class="hint">📸 Toma captura de pantalla y envíala por WhatsApp.</p>
    <button class="ghost" id="editar">Cambiar algo</button>
    <button class="ghost" id="otra">Escoger para otra persona</button>
  </section>
</main>

<script>
// Cambia este texto con el nombre y fecha del evento (o déjalo vacío)
const EVENTO = "";

const ACOMP = "Con arroz de coco, puré de papa y vegetales salteados";
const ACOMP2 = "Con puré de papa gratinado y vegetales salteados";

const MENU = [
  {id:"V", titulo:"Bienvenida", opciones:[
    {cod:"V1", nom:"Copa de vino"},
    {cod:"V2", nom:"Cóctel de frutas sin licor"}
  ]},
  {id:"P", titulo:"Plato fuerte", grupos:{P1:"Adultos", K1:"Menú infantil"}, opciones:[
    {cod:"P1", nom:"Menú 1 – Pechuga rellena", desc:"De jamón y queso mozzarella en salsa carbonara. "+ACOMP},
    {cod:"P2", nom:"Menú 2 – Pernil de cerdo", desc:ACOMP, sub:{titulo:"¿Qué salsa quieres?", ops:["Natural","De ciruela"]}},
    {cod:"P3", nom:"Menú 3 – Plato mixto", desc:ACOMP, sub:{titulo:"¿Qué combinación?", ops:["Carne + pollo","Carne + cerdo"]}},
    {cod:"P4", nom:"Menú 4 – Pasta con pollo y champiñones", desc:"En salsa carbonara, con pan de ajo"},
    {cod:"P5", nom:"Menú 5 – Steak de lomo fino", desc:"En salsa de pimienta. "+ACOMP},
    {cod:"P6", nom:"Menú 6 – Solomito", desc:"En salsa de champiñones"},
    {cod:"P7", nom:"Menú 7 – Filete de róbalo", desc:"En salsa marinera"},
    {cod:"P8", nom:"Menú 8 – Medallones de lomo fino con tocineta", desc:"En salsa de champiñones. "+ACOMP2},
    {cod:"P9", nom:"Menú 9 – Salmón al ajillo", desc:ACOMP2},
    {cod:"K1", nom:"Infantil – Pechuga a la plancha", desc:"Con papas fritas"},
    {cod:"K2", nom:"Infantil – Carne kids", desc:"Con papas fritas"}
  ]},
  {id:"D", titulo:"Postre", opciones:[
    {cod:"D1", nom:"Napoleón"},
    {cod:"D2", nom:"Torta de chocolate"}
  ]}
];

const $ = id=>document.getElementById(id);
if(EVENTO){ $("evento").textContent=EVENTO; $("r-evento").textContent=EVENTO; }

const cont = $("secciones");
MENU.forEach(sec=>{
  const fs = document.createElement("fieldset");
  let html = `<legend>${sec.titulo}</legend>`;
  sec.opciones.forEach(o=>{
    if(sec.grupos && sec.grupos[o.cod]) html += `<p class="grupo">${sec.grupos[o.cod]}</p>`;
    html += `<label class="opt"><input type="radio" name="${sec.id}" value="${o.cod}"><span class="dot"></span><span><b>${o.nom}</b>${o.desc?`<small>${o.desc}</small>`:""}</span></label>`;
    if(o.sub) html += `<div class="sub" id="sub-${o.cod}"><p>${o.sub.titulo}</p><div class="chips">${
      o.sub.ops.map(s=>`<label class="chip"><input type="radio" name="sub-${o.cod}" value="${s}"><span>${s}</span></label>`).join("")}</div></div>`;
  });
  fs.innerHTML = html;
  cont.appendChild(fs);
});

document.querySelectorAll('input[name="P"]').forEach(r=>r.addEventListener("change",()=>{
  document.querySelectorAll(".sub").forEach(s=>s.classList.toggle("show", s.id==="sub-"+r.value));
}));

function elegido(n){const el=document.querySelector(`input[name="${n}"]:checked`);return el?el.value:null}

$("ver").addEventListener("click",()=>{
  const nombre=$("nombre").value.trim();
  if(!nombre){$("error").textContent="Escribe tu nombre para saber de quién es el pedido.";$("nombre").focus();return;}
  for(const sec of MENU){
    if(!elegido(sec.id)){
      $("error").textContent=`Falta escoger: ${sec.titulo.toLowerCase()}.`;
      document.querySelector(`input[name="${sec.id}"]`).closest("fieldset").scrollIntoView({behavior:"smooth",block:"start"});
      return;
    }
    const op=sec.opciones.find(o=>o.cod===elegido(sec.id));
    if(op.sub && !elegido("sub-"+op.cod)){
      $("error").textContent=`${op.sub.titulo} (${op.nom})`;
      $("sub-"+op.cod).scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
  }
  $("error").textContent="";
  const codigos=[]; let filas="";
  MENU.forEach(sec=>{
    const op=sec.opciones.find(o=>o.cod===elegido(sec.id));
    let txt=op.nom, c=op.cod;
    if(op.sub){const s=elegido("sub-"+op.cod); txt+=` (${s.toLowerCase()})`; c+=" "+s.toLowerCase();}
   
    codigos.push(c);
    filas+=`<div class="row"><span>${sec.titulo}</span><strong>${txt}</strong></div>`;
  });
  $("r-nombre").textContent=nombre;
  $("r-filas").innerHTML=filas;
  $("r-codigos").textContent=codigos.join(" · ");
  $("formulario").style.display="none";
  $("resumen").classList.add("show");
  window.scrollTo({top:0});
});

$("editar").addEventListener("click",()=>{
  $("resumen").classList.remove("show");
  $("formulario").style.display="";
  window.scrollTo({top:0});
});
$("otra").addEventListener("click",()=>{
  document.querySelectorAll("input[type=radio]").forEach(r=>r.checked=false);
  document.querySelectorAll(".sub").forEach(s=>s.classList.remove("show"));
  $("nombre").value="";
  $("resumen").classList.remove("show");
  $("formulario").style.display="";
  window.scrollTo({top:0});
  $("nombre").focus();
});
</script>
</body>
</html>
